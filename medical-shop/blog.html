<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="فروش لوازم مصرفی و یکبار مصرف پزشکی، تجهیزات لاپاراسکوپی، استپلر جراحی، مش و لوازم جانبی الکتروکوتر">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<main class="container"><div class="posts" id="posts"></div></main>
<div id="site-footer"></div>
<script>
  $("#posts").innerHTML = POSTS.map(p => `<article class="post" id="post-${p.id}"><div class="pi">${imgOr(`assets/img/blog/${p.id}.jpg`, p.title, p.icon)}</div><div class="post-b"><div class="meta"><span>${p.cat}</span><span>${p.date}</span></div><h3>${p.title}</h3><p>${p.excerpt}</p></div></article>`).join("");
</script>
