<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سبد خرید | {name}</title>
<meta name="description" content="فروش لوازم مصرفی و یکبار مصرف پزشکی، تجهیزات لاپاراسکوپی، استپلر جراحی، مش و لوازم جانبی الکتروکوتر">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="data/site.js"></script><script src="data/products.js"></script>
<script src="assets/js/icons.js"></script><script src="assets/js/app.js"></script>
</head>
<body>
<div id="site-header"></div>
<div class="page-head"><div class="container"><h1>سبد خرید و استعلام</h1><div class="crumb"><a href="index.html">خانه</a> / سبد خرید</div></div></div>
<main class="container cart-wrap" id="cart-root"></main>
<div id="site-footer"></div>
<script>
  function renderCart() {
    const items = Cart.get().map(i => ({ ...i, p: PRODUCTS.find(p => p.id === i.id) })).filter(i => i.p);
    if (!items.length) { $("#cart-root").style.display = "block"; $("#cart-root").innerHTML = `<div class="empty"><div style="width:120px;margin:0 auto 10px">${icon("bag")}</div><h3>سبد خرید شما خالی است</h3><p style="margin:8px 0 16px">برای مشاهده محصولات به فروشگاه بروید.</p><a class="btn" href="shop.html">رفتن به فروشگاه</a></div>`; return; }
    const priced = items.filter(i => i.p.price), total = priced.reduce((s, i) => s + i.p.price * i.qty, 0);
    $("#cart-root").innerHTML = `
      <div class="cart-table">${items.map(i => `<div class="ci-row">
        <a class="pic" href="product.html?id=${i.p.id}">${productImg(i.p)}</a>
        <div><h3><a href="product.html?id=${i.p.id}">${i.p.title}</a></h3><small>${catTitle(i.p.cat)} — ${brandTitle(i.p.brand)}</small></div>
        <div class="qty"><button onclick="Cart.set(${i.id},${i.qty + 1})">+</button><input value="${fa(i.qty)}" readonly><button onclick="Cart.set(${i.id},${i.qty - 1})">−</button></div>
        <div class="price">${i.p.price ? `<b>${money(i.p.price * i.qty)}</b>` : `<span class="inquiry">استعلام</span>`}</div>
        <button class="rm" onclick="Cart.remove(${i.id})" aria-label="حذف">✕</button></div>`).join("")}</div>
      <aside class="box summary"><h4>خلاصه سفارش</h4>
        <div class="row"><span>تعداد اقلام</span><b>${fa(Cart.count())}</b></div>
        <div class="row"><span>اقلام نیازمند استعلام</span><b>${fa(items.length - priced.length)}</b></div>
        <div class="row"><span>جمع مبلغ قطعی</span><b>${total ? money(total) : "—"}</b></div>
        <form class="form" id="order"><input required name="name" placeholder="نام و نام خانوادگی / نام مرکز درمانی"><input required name="phone" placeholder="شماره تماس" inputmode="tel"><input name="city" placeholder="شهر"><textarea name="note" rows="3" placeholder="توضیحات (سایز، برند، تعداد عمده و...)"></textarea>
          <button class="btn" style="justify-content:center">ثبت سفارش / درخواست پیش‌فاکتور</button>
          <small style="color:var(--muted)">پس از ثبت، کارشناسان ما برای تأیید قیمت و نحوه ارسال با شما تماس می‌گیرند.</small></form>
      </aside>`;
    $("#order").onsubmit = e => {
      e.preventDefault(); const f = new FormData(e.target);
      const text = `سفارش جدید از ${f.get("name")} (${f.get("phone")}) - ${f.get("city") || ""}\n` + items.map(i => `• ${i.p.title} × ${i.qty}`).join("\n") + (f.get("note") ? `\nتوضیحات: ${f.get("note")}` : "");
      /* تا زمان اتصال به بک‌اند، سفارش به واتساپ فروشگاه ارسال می‌شود */
      window.open(`https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(text)}`, "_blank");
      Cart.save([]);
    };
  }
  document.addEventListener("cart:change", renderCart);
  renderCart();
</script>
</body>
</html>
