<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تماس با ما | {name}</title>
<meta name="description" content="فروش لوازم مصرفی و یکبار مصرف پزشکی، تجهیزات لاپاراسکوپی، استپلر جراحی، تروکار، مش و لوازم جانبی الکتروکوتر">
<meta property="og:type" content="website">
<meta property="og:title" content="تماس با ما | ">
<meta property="og:description" content="فروش لوازم مصرفی و یکبار مصرف پزشکی، تجهیزات لاپاراسکوپی، استپلر جراحی، تروکار، مش و لوازم جانبی الکتروکوتر">
<meta property="og:locale" content="fa_IR">
<meta name="theme-color" content="#262626">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/style.css">
<script src="data/content.js" defer></script>
<script src="assets/js/icons.js" defer></script>
<script src="assets/js/app.js" defer></script>
<script src="assets/js/pages/contact.js" defer></script>
</head>
<body>
<a class="skip" href="#main">رفتن به محتوا</a>
<div id="site-header"></div>
<div class="page-head"><div class="container"><h1 id="ph-title">تماس با ما</h1><nav class="crumb" aria-label="مسیر"><a href="index.html">خانه</a> / تماس با ما</nav></div></div>
<main id="main" class="container contact-grid">
  <div id="c-cards"></div>
  <div class="box"><h4>ارسال پیام / درخواست پیش‌فاکتور</h4>
    <form class="form" id="contact-form" novalidate>
      <div class="two"><input name="name" required maxlength="80" placeholder="نام و نام خانوادگی" autocomplete="name"><input name="phone" required maxlength="20" placeholder="شماره تماس" inputmode="tel" autocomplete="tel"></div>
      <div class="two"><input name="company" maxlength="120" placeholder="نام مرکز درمانی / شرکت"><select name="subject"><option>درخواست پیش‌فاکتور</option><option>استعلام قیمت</option><option>پیگیری سفارش</option><option>همکاری / نمایندگی</option><option>سایر</option></select></div>
      <textarea name="note" required maxlength="2000" rows="6" placeholder="متن پیام (نام کالا، تعداد، سایز...)"></textarea>
      <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn">ارسال پیام</button><p class="form-msg" id="form-msg" role="status"></p>
    </form>
  </div>
</main>
<div class="container"><div class="map" id="map">محل نقشه — آدرس را در پنل مدیریت وارد کنید</div></div>
<div id="site-footer"></div>
</body>
</html>
