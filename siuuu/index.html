<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIUUU Vision</title>
<!--
  Put ronaldo.mp4 next to this file (or drag & drop the video onto the page).
  Open in Chrome → INITIALIZE → show LEFT hand 5 + RIGHT hand 2 side by side.
  Keys: T = run the show without camera · R = reset · H = hide panels
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --neon: #39ff14; --muted: rgba(255,255,255,.5); --panel: rgba(6,10,8,.74); --line: rgba(57,255,20,.32); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; font-family: 'JetBrains Mono', ui-monospace, monospace; }
  #bg, #fx { position: fixed; inset: 0; width: 100%; height: 100%; }
  #crt { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.7) 100%); }
  #topbar { position: fixed; left: 16px; top: 16px; font-size: 10.5px; line-height: 1.75; letter-spacing: .12em; text-transform: uppercase;
    color: var(--neon); text-shadow: 0 0 8px rgba(57,255,20,.55); white-space: pre; pointer-events: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; }
  #cam { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #clip { position: fixed; z-index: 6; opacity: 0; transform: scale(.82); transition: opacity .7s, transform .7s; border-radius: 6px; object-fit: cover; pointer-events: none; background: #000; }
  #clip.show { opacity: 1; transform: scale(1); }

  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px);
    box-shadow: 0 0 28px rgba(57,255,20,.1), inset 0 0 20px rgba(57,255,20,.04); overflow: hidden; }
  .panel header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 10.5px; color: var(--muted);
    border-bottom: 1px solid var(--line); letter-spacing: .1em; text-transform: uppercase; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 8px var(--neon); animation: blink 1.2s infinite; }
  .rec { width: 8px; height: 8px; border-radius: 50%; background: #ff2d55; box-shadow: 0 0 8px #ff2d55; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  #camPanel { left: 16px; bottom: 16px; width: 380px; }
  #camView { display: block; width: 100%; aspect-ratio: 16 / 10; background: #000; }
  #lock { height: 3px; width: 0; background: var(--neon); box-shadow: 0 0 10px var(--neon); transition: width .1s; }
  #camHud { display: flex; justify-content: space-between; padding: 8px 12px; font-size: 12px; color: var(--muted); }
  #camHud .ok { color: var(--neon); text-shadow: 0 0 8px var(--neon); }

  #codePanel { right: 16px; top: 16px; bottom: 16px; width: 390px; display: flex; flex-direction: column; }
  #code { flex: 1; margin: 0; padding: 12px; font-size: 10.5px; line-height: 1.55; overflow: hidden; white-space: pre-wrap; word-break: break-all; color: #b9c7b5; }
  #telemetry { margin: 0; padding: 10px 12px; height: 168px; font-size: 10.5px; line-height: 1.5; color: var(--neon); border-top: 1px solid var(--line); overflow: hidden; white-space: pre; }
  .k { color: #ff79c6; } .s { color: #f1fa8c; } .c { color: #5f7360; font-style: italic; } .n { color: #bd93f9; } .f { color: #50fa7b; }
  .cursor { display: inline-block; width: 7px; height: 12px; background: var(--neon); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }

  #status { position: fixed; left: 16px; top: 112px; font-size: 11px; color: var(--muted); }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.88); z-index: 10; padding: 16px; }
  #start button { font: 700 18px 'JetBrains Mono', monospace; color: #000; background: var(--neon); border: 0; border-radius: 8px;
    padding: 16px 36px; cursor: pointer; box-shadow: 0 0 34px var(--neon); display: block; margin: 0 auto; }
  #start p { color: var(--muted); font-size: 13px; text-align: center; margin-top: 18px; line-height: 1.8; }
  .hide { display: none !important; }
  @media (max-width: 900px) { #codePanel { display: none; } #camPanel { width: 220px; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<video id="clip" src="ronaldo.mp4" playsinline preload="auto"></video>
<video id="cam" playsinline muted></video>
<div id="topbar"></div>
<div id="status"></div>
<div id="crt"></div>

<section class="panel" id="camPanel">
  <header><span class="rec"></span>vision.feed · mediapipe/hands<span id="fps" style="margin-left:auto">-- fps</span></header>
  <canvas id="camView"></canvas>
  <div id="lock"></div>
  <div id="camHud"><span id="hudL">L —</span><span id="hudState">IDLE</span><span id="hudR">R —</span></div>
</section>

<section class="panel" id="codePanel">
  <header><span class="dot"></span>siuuu.engine.js<span style="margin-left:auto">● live</span></header>
  <pre id="code"></pre>
  <pre id="telemetry"></pre>
</section>

<div id="start"><div>
  <button id="go">▶ INITIALIZE</button>
  <p>LEFT hand ✋ 5 &nbsp;+&nbsp; RIGHT hand ✌️ 2<br>T = run without camera · R = reset · H = hide panels</p>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script id="main">
// ===== config =====
const CFG = {
  particles: 7000,
  holdFrames: 12,          // frames the 5+2 gesture must hold before firing
  leftCount: 5, rightCount: 2,
  stagger: 650,            // left→right wave delay (ms)
  siuuuMs: 3800,           // how long the particle Ronaldo stays before the clip
  outroMs: 9000,           // how long the final text stays
  idleText: '✋ ✌️\n5 + 2',
  finalText: 'CR7\nTHE GOAT',
};
const PALETTES = {
  rainbow: { hues: [330, 345, 0, 15, 280, 300, 200, 190], spin: true },
  neon:    { hues: [105, 120, 135, 150, 165, 180], spin: false },
  gold:    { hues: [28, 36, 42, 48, 52], spin: false },
};
const $ = id => document.getElementById(id);
const fx = $('fx'), ctx = fx.getContext('2d');
const clip = $('clip'), cam = $('cam');
let W, H, DPR, flash = 0;
const status = msg => { $('status').textContent = msg; };

// ===== particles =====
const N = CFG.particles;
const px = new Float32Array(N), py = new Float32Array(N), vx = new Float32Array(N), vy = new Float32Array(N);
const tx = new Float32Array(N), ty = new Float32Array(N), startAt = new Float64Array(N);
const hasTarget = new Uint8Array(N), size = new Float32Array(N);
let buckets = [], blend = 'lighter', scene = null;
for (let i = 0; i < N; i++) {
  px[i] = Math.random() * innerWidth; py[i] = Math.random() * innerHeight;
  size[i] = 1.3 + Math.random() * 1.5;
}

// usable area: excludes the code panel (right) and keeps text above the camera panel (bottom-left)
function stage() {
  const side = $('codePanel').getClientRects().length && W > 900 ? 390 + 32 : 0;
  const camEl = $('camPanel'), camOn = camEl.getClientRects().length > 0;
  return { x: 0, y: 0, w: W - side, h: H,
    camRight: camOn ? camEl.offsetLeft + camEl.offsetWidth + 16 : 0,
    textH: camOn ? camEl.offsetTop - 16 : H };
}
function centered(scale) {
  const s = stage(), h = s.textH;
  return { x: s.x + s.w * (1 - scale) / 2, y: h * (1 - scale) / 2, w: s.w * scale, h: h * scale };
}

// ===== shape → target points =====
const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });
function sample(draw) {
  off.width = W; off.height = H;
  octx.clearRect(0, 0, W, H);
  draw(octx);
  const d = octx.getImageData(0, 0, W, H).data;
  let filled = 0;
  for (let i = 3; i < d.length; i += 16) if (d[i] > 128) filled++;
  const step = Math.max(2, Math.round(Math.sqrt((filled * 4) / N)));
  const pts = [], cols = [];
  for (let y = 0; y < H; y += step)
    for (let x = 0; x < W; x += step) {
      const o = (y * W + x) * 4;
      if (d[o + 3] > 128) { pts.push(x, y); cols.push(d[o], d[o + 1], d[o + 2]); }
    }
  return { pts, cols };
}

function textDraw(text, box, fill) {
  return g => {
    const lines = text.split('\n');
    g.font = '900 100px system-ui, sans-serif';
    const widest = Math.max(...lines.map(l => g.measureText(l).width));
    const fs = Math.min((100 * box.w * 0.92) / widest, (box.h * 0.85) / (lines.length * 1.05));
    g.font = `900 ${fs}px system-ui, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = fill ? fill(g, box) : '#fff';
    const lh = fs * 1.05, y0 = box.y + box.h / 2 - (lh * (lines.length - 1)) / 2;
    lines.forEach((l, i) => g.fillText(l, box.x + box.w / 2, y0 + i * lh));
  };
}

// Ronaldo mid-SIUUU landing: legs wide, arms out and down. Units: 100 = full height.
function drawRonaldo(g, cx, top, h) {
  const u = h / 100, P = (x, y) => [cx + x * u, top + y * u];
  const SKIN = '#e3a77c', RED = '#e1061b', WHITE = '#f4f4f4', HAIR = '#8a5630', GOLD = '#ffcf40';
  const limb = (a, b, w, c) => {
    g.strokeStyle = c; g.lineWidth = w * u; g.lineCap = 'round';
    g.beginPath(); g.moveTo(...P(...a)); g.lineTo(...P(...b)); g.stroke();
  };
  const poly = (pts, c) => {
    g.fillStyle = c; g.beginPath();
    pts.forEach((p, i) => g[i ? 'lineTo' : 'moveTo'](...P(...p)));
    g.closePath(); g.fill();
  };
  for (const s of [-1, 1]) {
    limb([s * 7, 57], [s * 13, 75], 8, SKIN);       // thigh
    limb([s * 13, 75], [s * 17, 92], 6.5, WHITE);   // sock
    limb([s * 15.5, 96], [s * 22, 96], 4.5, GOLD);  // boot
    limb([s * 10, 21], [s * 21, 33], 7.5, RED);     // sleeve
    limb([s * 21, 33], [s * 31, 46], 5.5, SKIN);    // forearm
    g.fillStyle = SKIN; g.beginPath(); g.arc(...P(s * 32.5, 48), 3.2 * u, 0, 7); g.fill();
  }
  poly([[-12, 18], [12, 18], [9.5, 47], [-9.5, 47]], RED);
  poly([[-10, 45], [10, 45], [13.5, 61], [1, 61], [0, 56], [-1, 61], [-13.5, 61]], WHITE);
  limb([0, 13], [0, 19], 5, SKIN);
  g.fillStyle = SKIN; g.beginPath(); g.ellipse(...P(0, 8.5), 5.6 * u, 6.8 * u, 0, 0, 7); g.fill();
  g.fillStyle = HAIR; g.beginPath(); g.ellipse(...P(0, 4.6), 6 * u, 3.9 * u, 0, Math.PI, 0); g.fill();
  g.fillStyle = WHITE; g.font = `900 ${10 * u}px system-ui, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('7', ...P(0, 31));
}

function siuuuDraw(g) {
  const s = stage(), wide = s.w > s.h * 1.1;
  const figH = wide ? s.h * 0.84 : s.h * 0.55;
  drawRonaldo(g, wide ? s.w * 0.34 : s.w / 2, s.h * (wide ? 0.08 : 0.04), figH);
  const box = wide ? { x: s.w * 0.56, y: s.h * 0.2, w: s.w * 0.42, h: s.h * 0.6 } : { x: 0, y: s.h * 0.62, w: s.w, h: s.h * 0.3 };
  textDraw('SIUUU!', box, (g, b) => {
    const gr = g.createLinearGradient(0, b.y + b.h * .3, 0, b.y + b.h * .7);
    gr.addColorStop(0, '#fff3b0'); gr.addColorStop(.5, '#ffcf40'); gr.addColorStop(1, '#ff7a00');
    return gr;
  })(g);
}

function clipRect() {
  const s = stage(), aspect = clip.videoWidth ? clip.videoWidth / clip.videoHeight : 716 / 954;
  const h = s.h * 0.86, w = h * aspect;
  // sit between the camera panel and the code panel when there is room
  const left = s.w - s.camRight > w + 60 ? s.camRight : s.x;
  return { x: left + (s.w - left - w) / 2, y: (s.h - h) / 2, w, h };
}
function frameDraw(g) {
  const r = clipRect(), p = 12, c = 46;
  g.strokeStyle = '#fff'; g.lineWidth = 3;
  g.strokeRect(r.x - p, r.y - p, r.w + 2 * p, r.h + 2 * p);
  g.lineWidth = 9; // heavy corner brackets
  for (const [x, y, dx, dy] of [[r.x - p, r.y - p, 1, 1], [r.x + r.w + p, r.y - p, -1, 1], [r.x - p, r.y + r.h + p, 1, -1], [r.x + r.w + p, r.y + r.h + p, -1, -1]]) {
    g.beginPath(); g.moveTo(x + dx * c, y); g.lineTo(x, y); g.lineTo(x, y + dy * c); g.stroke();
  }
}

const SCENES = {
  idle:  { draw: () => textDraw(CFG.idleText, centered(0.55)), color: 'rainbow' },
  siuuu: { draw: () => siuuuDraw, color: 'image' },
  frame: { draw: () => frameDraw, color: 'neon' },
  final: { draw: () => textDraw(CFG.finalText, centered(0.8)), color: 'gold' },
};

function paletteBuckets(name) {
  const p = PALETTES[name];
  return p.hues.map((hue, k) => ({ hue, spin: p.spin, idx: Array.from({ length: Math.ceil((N - k) / p.hues.length) }, (_, j) => k + j * p.hues.length) }));
}

// name = null → explode
function applyScene(name, instant = false) {
  scene = name;
  const def = SCENES[name];
  if (!def) {
    hasTarget.fill(0);
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2, f = 8 + Math.random() * 18;
      vx[i] += Math.cos(a) * f; vy[i] += Math.sin(a) * f;
    }
    return;
  }
  const { pts, cols } = sample(def.draw());
  const n = pts.length / 2;
  if (!n) return;
  const order = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [order[i], order[j]] = [order[j], order[i]]; }
  const now = performance.now(), byColor = new Map();
  for (let i = 0; i < N; i++) {
    const k = i < n ? order[i] : (Math.random() * n) | 0;
    tx[i] = pts[k * 2]; ty[i] = pts[k * 2 + 1];
    hasTarget[i] = 1;
    startAt[i] = instant ? 0 : now + (tx[i] / W) * CFG.stagger + Math.random() * 180;
    if (def.color === 'image') {
      const key = `rgb(${cols[k * 3] & 0xf0},${cols[k * 3 + 1] & 0xf0},${cols[k * 3 + 2] & 0xf0})`;
      if (!byColor.has(key)) byColor.set(key, []);
      byColor.get(key).push(i);
    }
  }
  buckets = def.color === 'image' ? [...byColor].map(([style, idx]) => ({ style, idx })) : paletteBuckets(def.color);
  blend = def.color === 'image' ? 'source-over' : 'lighter';
}

// ===== render =====
function frame(now) {
  drawBg(now);
  ctx.globalCompositeOperation = 'destination-out';   // fade → motion trails, keeps the grid visible
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < N; i++) {
    if (hasTarget[i] && now >= startAt[i]) {
      vx[i] += (tx[i] - px[i]) * 0.02; vy[i] += (ty[i] - py[i]) * 0.02;
      vx[i] *= 0.85; vy[i] *= 0.85;
    } else {
      vx[i] += Math.sin(py[i] * 0.01 + now * 0.0005) * 0.03;
      vy[i] += Math.cos(px[i] * 0.01 + now * 0.0004) * 0.03;
      vx[i] *= 0.97; vy[i] *= 0.97;
    }
    px[i] += vx[i]; py[i] += vy[i];
    if (!hasTarget[i]) {
      if (px[i] < 0) px[i] += W; else if (px[i] > W) px[i] -= W;
      if (py[i] < 0) py[i] += H; else if (py[i] > H) py[i] -= H;
    }
  }

  ctx.globalCompositeOperation = blend;
  const spin = (now * 0.02) % 360;
  for (const b of buckets) {
    ctx.fillStyle = b.style || `hsl(${(b.hue + (b.spin ? spin : 0)) % 360} 100% 58%)`;
    for (const i of b.idx) ctx.fillRect(px[i], py[i], size[i], size[i]);
  }
  if (flash > 0.01) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,220,140,${flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
    flash *= 0.9;
  }
  drawCam(now);
  requestAnimationFrame(frame);
}

// ===== AI-vision background =====
const bg = $('bg'), bctx = bg.getContext('2d');
const vis = document.createElement('canvas'), vctx = vis.getContext('2d', { willReadFrequently: true });
const CELL = 9, DOT = [0, 1.4, 2.3, 3.2, 4.2], DOT_A = [0, .16, .26, .4, .55];

function camCover(w, h) {
  const vw = cam.videoWidth || 16, vh = cam.videoHeight || 9, s = Math.max(w / vw, h / vh);
  return { dw: vw * s, dh: vh * s, ox: (w - vw * s) / 2, oy: (h - vh * s) / 2 };
}

function drawBg(now) {
  const g = bctx, dim = state === 'video' ? 0.35 : state === 'siuuu' ? 0.6 : 1;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#010503'; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(W * .4, H * .45, 0, W * .4, H * .45, Math.max(W, H) * .7);
  rg.addColorStop(0, 'rgba(0,70,45,.35)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);

  // perspective floor grid
  const hz = H * .6, vp = W * .4, t = (now * .00035) % 1;
  g.strokeStyle = `rgba(57,255,20,${.09 * dim})`; g.lineWidth = 1; g.beginPath();
  for (let i = -24; i <= 24; i++) { g.moveTo(vp + i * 6, hz); g.lineTo(vp + i * W * .1, H); }
  for (let k = 0; k < 16; k++) { const z = (k + t) / 16, y = hz + (H - hz) * z * z; g.moveTo(0, y); g.lineTo(W, y); }
  g.stroke();

  // camera → edge-detected dot matrix (what the model "sees")
  const cols = Math.ceil(W / CELL), rows = Math.ceil(H / CELL);
  if (vis.width !== cols || vis.height !== rows) { vis.width = cols; vis.height = rows; }
  let d = null;
  if (cam.readyState >= 2) {
    const c = camCover(cols, rows);
    vctx.save(); vctx.translate(cols, 0); vctx.scale(-1, 1);
    vctx.drawImage(cam, c.ox, c.oy, c.dw, c.dh); vctx.restore();
    d = vctx.getImageData(0, 0, cols, rows).data;
  }
  const lum = o => (d[o] + d[o + 1] + d[o + 2]) / 765;
  const levels = [[], [], [], [], []];
  for (let y = 0; y < rows; y++)
    for (let x = 0; x < cols; x++) {
      let v;
      if (d) {
        const o = (y * cols + x) * 4, l = lum(o);
        const e = Math.abs(l - lum(x < cols - 1 ? o + 4 : o)) + Math.abs(l - lum(y < rows - 1 ? o + cols * 4 : o));
        v = Math.min(1, e * 4 + l * .3);
      } else {
        v = (.5 + .5 * Math.sin(x * .13 + now * .0009) * Math.cos(y * .16 - now * .0012)) ** 4 * .7;
      }
      const lvl = Math.min(4, (v * 5) | 0);
      if (lvl) levels[lvl].push(x * CELL + CELL / 2, y * CELL + CELL / 2);
    }
  for (let l = 1; l < 5; l++) {
    const r = DOT[l], pts = levels[l];
    g.fillStyle = `rgba(${l > 3 ? '120,255,200' : '57,255,20'},${DOT_A[l] * dim})`;
    for (let i = 0; i < pts.length; i += 2) g.fillRect(pts[i] - r / 2, pts[i + 1] - r / 2, r, r);
  }

  // full-screen hand skeleton + lock-on reticle
  const c = camCover(W, H), map = p => [W - (p.x * c.dw + c.ox), p.y * c.dh + c.oy];
  g.font = '9px JetBrains Mono, monospace'; g.textAlign = 'left';
  for (const hand of handsData) {
    const pts = hand.lm.map(map);
    g.strokeStyle = `rgba(57,255,20,${.35 * dim})`; g.lineWidth = 2; g.beginPath();
    for (const [a, b] of CONN) { g.moveTo(...pts[a]); g.lineTo(...pts[b]); }
    g.stroke();
    pts.forEach(([x, y], i) => {
      g.fillStyle = `rgba(200,255,220,${.6 * dim})`; g.fillRect(x - 2, y - 2, 4, 4);
      g.fillStyle = `rgba(57,255,20,${.55 * dim})`; g.fillText(String(i).padStart(2, '0'), x + 5, y - 4);
    });
    const [cx, cy] = pts[9], R = 70, rot = now * .0015 * (hand.side === 'L' ? 1 : -1);
    g.strokeStyle = `rgba(57,255,20,${.6 * dim})`; g.lineWidth = 1.5;
    for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(cx, cy, R, rot + k * Math.PI / 2, rot + k * Math.PI / 2 + .9); g.stroke(); }
    g.beginPath(); g.arc(cx, cy, R + 10, -rot, -rot + Math.PI * 1.3); g.stroke();
    g.beginPath();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { g.moveTo(cx + dx * (R - 14), cy + dy * (R - 14)); g.lineTo(cx + dx * (R + 18), cy + dy * (R + 18)); }
    g.stroke();
    g.fillStyle = `rgba(57,255,20,${.85 * dim})`;
    g.fillText(`HAND_${hand.side} · ${hand.count} · ${hand.conf.toFixed(2)}`, cx + R + 14, cy - R + 6);
  }

  // vertical scan sweep
  const sy = ((now * .25) % (H + 200)) - 100;
  const sg = g.createLinearGradient(0, sy - 100, 0, sy);
  sg.addColorStop(0, 'rgba(57,255,20,0)'); sg.addColorStop(1, `rgba(57,255,20,${.07 * dim})`);
  g.fillStyle = sg; g.fillRect(0, sy - 100, W, 100);
  g.fillStyle = `rgba(120,255,180,${.35 * dim})`; g.fillRect(0, sy, W, 1);

  // screen corner brackets + edge ruler
  g.strokeStyle = 'rgba(57,255,20,.45)'; g.lineWidth = 2; g.beginPath();
  for (const [x, y, dx, dy] of [[6, 6, 1, 1], [W - 6, 6, -1, 1], [6, H - 6, 1, -1], [W - 6, H - 6, -1, -1]]) {
    g.moveTo(x + dx * 34, y); g.lineTo(x, y); g.lineTo(x, y + dy * 34);
  }
  g.stroke();
  g.strokeStyle = 'rgba(57,255,20,.18)'; g.lineWidth = 1; g.beginPath();
  for (let y = 60; y < H - 60; y += 12) { const len = y % 60 === 0 ? 10 : 4; g.moveTo(4, y); g.lineTo(4 + len, y); }
  g.stroke();
}

// ===== camera panel: feed + green hand skeleton =====
const camView = $('camView'), cctx = camView.getContext('2d');
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const TIPS = [4, 8, 12, 16, 20];
let handsData = [];

function drawCam(now) {
  const cw = camView.clientWidth, ch = camView.clientHeight;
  if (!cw) return;
  if (camView.width !== Math.round(cw * DPR)) { camView.width = Math.round(cw * DPR); camView.height = Math.round(ch * DPR); }
  const g = cctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#000'; g.fillRect(0, 0, cw, ch);
  const vw = cam.videoWidth || 16, vh = cam.videoHeight || 10;
  const s = Math.max(cw / vw, ch / vh), dw = vw * s, dh = vh * s, ox = (cw - dw) / 2, oy = (ch - dh) / 2;
  if (cam.readyState >= 2) {
    g.save(); g.translate(cw, 0); g.scale(-1, 1);
    g.globalAlpha = 0.85; g.drawImage(cam, ox, oy, dw, dh);
    g.restore();
  } else {
    g.fillStyle = 'rgba(57,255,20,.6)'; g.font = '11px JetBrains Mono, monospace'; g.textAlign = 'center';
    g.fillText('NO SIGNAL', cw / 2, ch / 2);
  }
  const map = p => [cw - (p.x * dw + ox), p.y * dh + oy];

  for (const hand of handsData) {
    const pts = hand.lm.map(map);
    const ok = hand.side === 'L' ? hand.count === CFG.leftCount : hand.count === CFG.rightCount;
    g.shadowColor = '#39ff14'; g.shadowBlur = 10;
    g.strokeStyle = '#39ff14'; g.lineWidth = 2;
    g.beginPath();
    for (const [a, b] of CONN) { g.moveTo(...pts[a]); g.lineTo(...pts[b]); }
    g.stroke();
    pts.forEach((p, i) => {
      g.fillStyle = TIPS.includes(i) ? '#39ff14' : '#fff';
      g.beginPath(); g.arc(p[0], p[1], TIPS.includes(i) ? 4 : 2.5, 0, 7); g.fill();
    });
    g.shadowBlur = 0;
    // bounding box with corner brackets + label
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x0 = Math.min(...xs) - 10, y0 = Math.min(...ys) - 10, x1 = Math.max(...xs) + 10, y1 = Math.max(...ys) + 10, c = 10;
    g.strokeStyle = ok ? '#39ff14' : 'rgba(255,255,255,.6)'; g.lineWidth = 1.5;
    g.beginPath();
    for (const [x, y, dx, dy] of [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]]) {
      g.moveTo(x + dx * c, y); g.lineTo(x, y); g.lineTo(x, y + dy * c);
    }
    g.stroke();
    const label = `${hand.side === 'L' ? 'LEFT' : 'RIGHT'} · ${hand.count}`;
    g.font = '700 10px JetBrains Mono, monospace'; g.textAlign = 'left';
    const lw = g.measureText(label).width + 8;
    g.fillStyle = ok ? '#39ff14' : 'rgba(255,255,255,.85)'; g.fillRect(x0, y0 - 15, lw, 14);
    g.fillStyle = '#000'; g.fillText(label, x0 + 4, y0 - 4.5);
  }
  // scanline sweep
  const sy = ((now / 12) % (ch + 40)) - 20;
  const gr = g.createLinearGradient(0, sy - 20, 0, sy);
  gr.addColorStop(0, 'rgba(57,255,20,0)'); gr.addColorStop(1, 'rgba(57,255,20,.18)');
  g.fillStyle = gr; g.fillRect(0, sy - 20, cw, 20);
}

// ===== gesture logic =====
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function countFingers(lm) {
  let c = 0;
  for (const [tip, pip] of [[8, 6], [12, 10], [16, 14], [20, 18]])
    if (dist(lm[tip], lm[0]) > dist(lm[pip], lm[0]) * 1.1) c++;
  if (dist(lm[4], lm[17]) > dist(lm[3], lm[17]) * 1.08 && dist(lm[4], lm[5]) > dist(lm[3], lm[5]) * 0.9) c++;
  return c;
}

let latency = 0, hold = 0, armed = true, state = 'idle', frames = 0, fps = 0, lastFpsAt = performance.now();
function onResults(res) {
  frames++;
  // side = position on the mirrored screen, so it matches the user's own left/right
  const hs = (res.multiHandLandmarks || []).map((lm, i) => ({ lm, count: countFingers(lm), mx: 1 - lm[0].x, conf: res.multiHandedness?.[i]?.score ?? 0 }));
  hs.sort((a, b) => a.mx - b.mx);
  if (hs.length === 2) { hs[0].side = 'L'; hs[1].side = 'R'; }
  else if (hs.length === 1) hs[0].side = hs[0].mx < 0.5 ? 'L' : 'R';
  handsData = hs;

  const L = hs.find(h => h.side === 'L'), R = hs.find(h => h.side === 'R');
  const lOk = L && L.count === CFG.leftCount, rOk = R && R.count === CFG.rightCount;
  const ok = hs.length === 2 && lOk && rOk;
  hold = ok ? hold + 1 : 0;
  if (!ok && state === 'idle') armed = true;
  if (ok && hold >= CFG.holdFrames && state === 'idle' && armed) { armed = false; runShow(); }

  $('hudL').textContent = `L ${L ? L.count : '—'}`; $('hudL').className = lOk ? 'ok' : '';
  $('hudR').textContent = `R ${R ? R.count : '—'}`; $('hudR').className = rOk ? 'ok' : '';
  $('lock').style.width = `${Math.min(1, hold / CFG.holdFrames) * 100}%`;
}

// ===== the show =====
let timers = [];
const later = (ms, fn) => timers.push(setTimeout(fn, ms));
function setState(s) { state = s; $('hudState').textContent = s.toUpperCase(); }

function runShow() {
  timers.forEach(clearTimeout); timers = [];
  setState('siuuu');
  sfx.whoosh();
  applyScene('siuuu');
  later(1300, () => { sfx.boom(); flash = 1; });
  later(CFG.siuuuMs, playClip);
}

let clipOk = true;
function playClip() {
  if (!clipOk || clip.error) { status('ronaldo.mp4 not found — drag & drop the video onto the page'); return outro(); }
  setState('video');
  applyScene(null);
  const r = clipRect();
  Object.assign(clip.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
  clip.currentTime = 0; clip.muted = false; clip.volume = 1;
  clip.classList.add('show');
  clip.play().catch(e => { status(`video: ${e.message}`); later(1500, outro); });
  later(450, () => applyScene('frame'));
}
clip.addEventListener('ended', () => { if (state === 'video') outro(); });
clip.addEventListener('error', () => { clipOk = false; });

function outro() {
  setState('outro');
  clip.classList.remove('show');
  applyScene(null);
  later(600, () => { applyScene('final'); sfx.boom(); flash = 0.6; });
  later(CFG.outroMs, () => { applyScene(null); later(800, () => { setState('idle'); applyScene('idle'); }); });
}

function reset() {
  timers.forEach(clearTimeout); timers = [];
  clip.pause(); clip.classList.remove('show');
  setState('idle'); applyScene('idle');
}

// ===== sound fx (synthesized) =====
let ac = null;
const sfx = {
  whoosh() {
    if (!ac) return;
    const t = ac.currentTime, len = 1.3;
    const buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(4000, t + len);
    const gn = ac.createGain();
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.45, t + len * 0.85); gn.gain.exponentialRampToValueAtTime(0.0001, t + len);
    src.connect(f).connect(gn).connect(ac.destination); src.start(t);
  },
  boom() {
    if (!ac) return;
    const t = ac.currentTime, o = ac.createOscillator(), gn = ac.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.6);
    gn.gain.setValueAtTime(0.9, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
    o.connect(gn).connect(ac.destination); o.start(t); o.stop(t + 0.8);
  },
};

// ===== camera + model =====
async function startCamera() {
  if (typeof Hands === 'undefined') throw new Error('MediaPipe failed to load (needs internet)');
  const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
  hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.6 });
  hands.onResults(onResults);
  cam.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'user' } });
  await cam.play();
  status('show LEFT ✋ 5 + RIGHT ✌️ 2');
  let busy = false;
  const loop = async () => {
    if (!busy && cam.readyState >= 2) {
      busy = true;
      const t0 = performance.now();
      try { await hands.send({ image: cam }); } finally { busy = false; latency = performance.now() - t0; }
    }
    requestAnimationFrame(loop);
  };
  loop();
}

// ===== decorative live code + telemetry =====
(function typewriter() {
  const src = $('main').textContent.trim();
  const re = /(\/\/[^\n]*)|(`[^`]*`|'[^'\n]*')|\b(const|let|function|return|if|else|for|of|new|await|async|while|true|false|null|try|catch|finally)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_$][\w$]*)(?=\()/g;
  const toks = [];
  let last = 0, m;
  while ((m = re.exec(src))) {
    if (m.index > last) toks.push(['', src.slice(last, m.index)]);
    toks.push([m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : m[4] ? 'n' : 'f', m[0]]);
    last = re.lastIndex;
  }
  toks.push(['', src.slice(last)]);
  const pre = $('code'), cursor = Object.assign(document.createElement('span'), { className: 'cursor' });
  pre.append(cursor);
  let ti = 0, ci = 0, node = null;
  setInterval(() => {
    for (let budget = 2 + ((Math.random() * 4) | 0); budget > 0; budget--) {
      if (ti >= toks.length) { pre.textContent = ''; pre.append(cursor); ti = 0; ci = 0; node = null; break; }
      const [cls, text] = toks[ti];
      if (!node) {
        node = cls ? Object.assign(document.createElement('span'), { className: cls }) : document.createTextNode('');
        pre.insertBefore(node, cursor);
      }
      node.textContent += text[ci++];
      if (ci >= text.length) { ti++; ci = 0; node = null; }
    }
    pre.scrollTop = pre.scrollHeight;
  }, 28);
})();

setInterval(() => {
  const now = performance.now();
  fps = (frames * 1000) / (now - lastFpsAt); frames = 0; lastFpsAt = now;
  $('fps').textContent = `${fps.toFixed(1)} fps`;
  const L = handsData.find(h => h.side === 'L'), R = handsData.find(h => h.side === 'R');
  const bar = Math.round(Math.min(1, hold / CFG.holdFrames) * 12);
  const lm = (handsData[0] || {}).lm;
  const f = v => (v >= 0 ? ' ' : '') + v.toFixed(3);
  const row = i => lm ? `lm[${String(i).padEnd(2)}] x=${f(lm[i].x)} y=${f(lm[i].y)} z=${f(lm[i].z)}` : `lm[${String(i).padEnd(2)}] ---`;
  $('topbar').textContent = [
    '◉ NEURAL VISION ENGINE v2.7',
    `model  hand_landmark_full · 21 kp × ${handsData.length || 2}`,
    `infer  ${fps.toFixed(1)} fps · ${latency.toFixed(0)} ms`,
    `detect ${handsData.map(h => `HAND_${h.side} ${h.conf.toFixed(2)}`).join(' · ') || 'scanning…'}`,
  ].join('\n');
  $('telemetry').textContent = [
    `> tracker        ${handsData.length ? 'LOCKED' : 'SCANNING…'}`,
    `> hands          ${handsData.length}`,
    `> gesture.left   ${L ? L.count : '-'}  ${L && L.count === CFG.leftCount ? '✓' : '·'}`,
    `> gesture.right  ${R ? R.count : '-'}  ${R && R.count === CFG.rightCount ? '✓' : '·'}`,
    `> lock           [${'█'.repeat(bar)}${'░'.repeat(12 - bar)}]`,
    `> particles      ${N}  scene=${scene || 'burst'}`,
    `> state          ${state.toUpperCase()}`,
    row(8), row(12),
  ].join('\n');
}, 250);

// ===== boot =====
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  fx.width = bg.width = W * DPR; fx.height = bg.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene) applyScene(scene, true);
  if (state === 'video') {
    const r = clipRect();
    Object.assign(clip.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
  }
}
addEventListener('resize', resize);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 't') runShow();
  if (k === 'r') reset();
  if (k === 'h') { $('codePanel').classList.toggle('hide'); $('camPanel').classList.toggle('hide'); if (scene) applyScene(scene); }
});
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('video/')) { clip.src = URL.createObjectURL(file); clipOk = true; status(`clip loaded: ${file.name}`); }
});

$('go').onclick = async () => {
  $('start').classList.add('hide');
  ac = new (window.AudioContext || window.webkitAudioContext)();
  try { clip.muted = true; await clip.play(); clip.pause(); clip.currentTime = 0; } catch (e) { /* missing file is handled in playClip */ }
  clip.muted = false;
  startCamera().catch(err => status(`camera: ${err.message} — press T to run the show`));
};

resize();
applyScene('idle', true);
requestAnimationFrame(frame);
</script>
</body>
</html>
